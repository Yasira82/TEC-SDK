name: Publish TEC SDK to npm

on:
  push:
    branches:
      - main

jobs:
  security-gate:
    name: 🔐 Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Zero-Width Character Scan
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          const ZWC = /[\u200B-\u200F\u202A-\u202E\u2060-\u2064\uFEFF\u00AD]/g;
          function scan(dir) {
            for (const f of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, f.name);
              if (f.isDirectory() && !['node_modules','dist'].includes(f.name)) scan(full);
              else if (f.name.endsWith('.ts')) {
                const content = fs.readFileSync(full, 'utf-8');
                if (ZWC.test(content)) { console.error('ZWC found: ' + full); process.exit(1); }
              }
            }
          }
          scan('./src');
          console.log('✅ Clean — no zero-width chars.');
          "

  test-and-publish:
    name: 🚀 Test & Publish
    runs-on: ubuntu-latest
    needs: security-gate
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm install

      - name: Run Tests
        run: npm test

      - name: Build SDK
        run: npm run build

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
