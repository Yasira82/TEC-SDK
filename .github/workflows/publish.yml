name: Publish TEC SDK to npm

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - '.github/workflows/publish.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - '.github/workflows/publish.yml'   # validate workflow changes on the PR itself
  workflow_dispatch:

permissions:
  contents: read
  # NOTE: npm provenance (--provenance + id-token) is intentionally NOT used —
  # this source repo is PRIVATE, and npm provenance only supports PUBLIC source
  # repos (422 "Unsupported source repository visibility: private"). Re-enable
  # id-token: write + --provenance only if this repo is made public.

jobs:
  security-gate:
    name: 🔐 Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-sdk-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-sdk-

      - name: Install dependencies
        run: npm install

      - name: Zero-Width Character Scan
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          const ZWC = /[\u200B-\u200F\u202A-\u202E\u2060-\u2064\uFEFF\u00AD]/g;
          function scan(dir) {
            for (const f of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, f.name);
              if (f.isDirectory() && !['node_modules','dist'].includes(f.name)) scan(full);
              else if (f.name.endsWith('.ts')) {
                const content = fs.readFileSync(full, 'utf-8');
                if (ZWC.test(content)) { console.error('ZWC found: ' + full); process.exit(1); }
              }
            }
          }
          scan('./src');
          console.log('✅ Clean — no zero-width chars.');
          "

  test-and-publish:
    name: 🚀 Test & Publish
    runs-on: ubuntu-latest
    needs: security-gate
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-sdk-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-sdk-

      - name: Install dependencies
        run: npm install

      - name: Run Tests
        run: npm test

      - name: Build SDK
        run: npm run build

      - name: Publish to npm
        if: github.event_name == 'push'
        run: |
          PUBLISHED=$(npm view @yasser172/tec-sdk version 2>/dev/null || echo "0.0.0")
          CURRENT=$(node -p "require('./package.json').version")
          if [ "$PUBLISHED" = "$CURRENT" ]; then
            echo "✅ Version $CURRENT already published — skipping"
            exit 0
          fi
          echo "📦 Publishing version $CURRENT..."

          # Publish, and if it fails, say what the failure actually means.
          #
          # NPM_TOKEN expires — 2026-11-25 is the LONGEST npm will issue, not a
          # date anyone chose, so this recurs by design. When it lapsed in
          # August 2026 npm answered `E404`, and on a SCOPED package E404 means
          # NOT AUTHENTICATED, not "no such package". An hour went into looking
          # for a package that was never missing.
          #
          # The fix for that hour is not detecting sooner — CI already goes red
          # in a minute. It is that the error should not send you the wrong way.
          if ! OUTPUT=$(npm publish --access public 2>&1); then
            echo "$OUTPUT"
            if echo "$OUTPUT" | grep -qiE 'E404|404 Not Found'; then
              echo ""
              echo "::error title=Read this before debugging::E404 on a SCOPED package means NOT AUTHENTICATED, not 'package missing'."
              echo "  The package exists. NPM_TOKEN is expired, revoked, or absent."
              echo "  Issue a new npm token and update the NPM_TOKEN repo secret."
              echo "  Do NOT go looking for the package or re-check its name."
            fi
            exit 1
          fi
          echo "$OUTPUT"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
