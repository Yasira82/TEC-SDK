name: 🔍 Security Analysis

on:
  # `push: [main]` removed. The `pull_request` run already analysed this exact
  # code; merging re-analysed it minutes later for the same answer. The weekly
  # `schedule` run still executes on the default branch, so the Security tab's
  # baseline — what actually ages and closes alerts — keeps refreshing. It
  # refreshes weekly now instead of per-merge. That is the trade, stated rather
  # than hidden: PR coverage is unchanged, main-branch coverage is coarser.
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

# One run per ref. Pushing again to a PR branch cancels the superseded run
# instead of racing it: the last commit is the only one anyone reads, and
# without this every intermediate push paid for a full pipeline — CI's five
# jobs, a CodeQL analysis, a Playwright install-build-and-run — that was
# obsolete before it finished.
#
# `main` is EXCLUDED from cancellation on purpose: a run there is the
# post-merge record (and the status a deploy gate reads). Cancelling those
# would trade money for the one signal worth keeping.
#
# This expression is copied verbatim from `tec-knowledge-base`
# knowledge-ci.yml — the fleet had TWO forms of this rule and the other one
# (tec-app, `cancel-in-progress: true`) cancels main runs as well. One rule,
# one spelling (P2).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  security-scan:
    name: 🔐 Security Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-sdk-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-sdk-

      - name: Install dependencies
        run: npm install

      - name: Zero-Width Character Scan
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          const ZWC = /[\u200B-\u200F\u202A-\u202E\u2060-\u2064\uFEFF\u00AD]/g;
          function scan(dir) {
            for (const f of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, f.name);
              if (f.isDirectory() && !['node_modules','dist'].includes(f.name)) scan(full);
              else if (f.name.endsWith('.ts')) {
                const content = fs.readFileSync(full, 'utf-8');
                if (ZWC.test(content)) { console.error('ZWC found: ' + full); process.exit(1); }
              }
            }
          }
          scan('./src');
          console.log('Clean — no zero-width chars found.');
          "

      # ── Production dependencies BLOCK ────────────────────────────────────
      # These ship inside the published package, which every TEC app installs.
      # An advisory here reaches users, so it stops the build. This is stricter
      # than what it replaces: it can no longer be lost among dev noise.
      - name: npm audit — production dependencies (blocking)
        run: npm audit --omit=dev --audit-level=high

      # ── Dev dependencies REPORT ──────────────────────────────────────────
      # This step used to block on these too, and the result was four
      # consecutive weeks of a red scheduled run that nobody acted on. A check
      # that is permanently red does not enforce anything — it teaches people
      # to ignore the whole workflow, which is how a real advisory gets missed.
      #
      # They are NOT silenced. Dev dependencies do not ship, but they DO run
      # here with access to the repo, so a compromised one is a build-time
      # supply-chain risk. The advisories are written into the job summary,
      # where they are read — rather than into an email that gets filtered.
      - name: npm audit — dev dependencies (report only)
        if: always()
        run: |
          {
            echo '### npm audit — dev dependencies'
            echo
            echo 'Not blocking: these are not published. They DO run in CI with'
            echo 'repo access, so triage them — do not let them accumulate.'
            echo
            echo '```'
            npm audit --audit-level=high 2>&1 | tail -40 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build Check
        run: npm run build
