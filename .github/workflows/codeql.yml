name: 🔍 Security Analysis

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - '.github/workflows/codeql.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  security-scan:
    name: 🔐 Security Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-sdk-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-sdk-

      - name: Install dependencies
        run: npm install

      - name: Zero-Width Character Scan
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          const ZWC = /[\u200B-\u200F\u202A-\u202E\u2060-\u2064\uFEFF\u00AD]/g;
          function scan(dir) {
            for (const f of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, f.name);
              if (f.isDirectory() && !['node_modules','dist'].includes(f.name)) scan(full);
              else if (f.name.endsWith('.ts')) {
                const content = fs.readFileSync(full, 'utf-8');
                if (ZWC.test(content)) { console.error('ZWC found: ' + full); process.exit(1); }
              }
            }
          }
          scan('./src');
          console.log('Clean — no zero-width chars found.');
          "

      - name: npm audit
        run: npm audit --audit-level=high

      - name: Build Check
        run: npm run build
