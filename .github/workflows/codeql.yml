name: 🔍 Security Analysis

on:
  push:
    branches: [main]
  # ✅ P2-8: اشتغل على PRs كمان
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'

jobs:
  security-scan:
    name: 🔐 Zero-Width Character Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Zero-Width Character Scan
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          const ZWC = /[\u200B-\u200F\u202A-\u202E\u2060-\u2064\uFEFF\u00AD]/g;
          function scan(dir) {
            for (const f of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, f.name);
              if (f.isDirectory() && !['node_modules','dist'].includes(f.name)) scan(full);
              else if (f.name.endsWith('.ts')) {
                const content = fs.readFileSync(full, 'utf-8');
                if (ZWC.test(content)) { console.error('ZWC found: ' + full); process.exit(1); }
              }
            }
          }
          scan('./src');
          console.log('Clean — no zero-width chars found.');
          "

      # ✅ P2-7: احذف continue-on-error — audit failures تبلوك الـ CI
      - name: npm audit
        run: npm audit --audit-level=high

      - name: Build Check
        run: npm run build
