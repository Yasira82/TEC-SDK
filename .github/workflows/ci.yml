name: CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '__tests__/**'
      - 'package*.json'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - '__tests__/**'
      - 'package*.json'
      - '.github/workflows/**'   # validate workflow/CI changes on the PR itself
  workflow_dispatch:

# One run per ref. Pushing again to a PR branch cancels the superseded run
# instead of racing it: the last commit is the only one anyone reads, and
# without this every intermediate push paid for a full pipeline — CI's five
# jobs, a CodeQL analysis, a Playwright install-build-and-run — that was
# obsolete before it finished.
#
# `main` is EXCLUDED from cancellation on purpose: a run there is the
# post-merge record (and the status a deploy gate reads). Cancelling those
# would trade money for the one signal worth keeping.
#
# This expression is copied verbatim from `tec-knowledge-base`
# knowledge-ci.yml — the fleet had TWO forms of this rule and the other one
# (tec-app, `cancel-in-progress: true`) cancels main runs as well. One rule,
# one spelling (P2).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}


permissions:
  contents: read

jobs:
  pipeline:
    name: Test + Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-sdk-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-sdk-

      - name: Install
        run: npm install

      # ✅ Test with coverage
      - name: Test
        run: npm run test:coverage

      # ✅ Build بعد الـ tests
      - name: Build
        run: npm run build

      # ✅ Upload coverage report
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sdk-coverage
          path: coverage/
          retention-days: 7
