name: Publish TEC SDK

on:
  push:
    branches: [main]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # 1️⃣ Checkout the repo
      - uses: actions/checkout@v4

      # 2️⃣ Setup Node.js
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://npm.pkg.github.com'

      # 3️⃣ Install dependencies
      - run: npm ci

      # 4️⃣ Lint the code
      - run: npm run lint

      # 5️⃣ Run tests
      - run: npm test

      # 6️⃣ Build the SDK
      - run: npm run build

      # 7️⃣ Publish to GitHub Packages
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
